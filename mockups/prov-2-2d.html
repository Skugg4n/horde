<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horde · prov 2 (ritad 2D-iso)</title>
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div id="stage" class="grade"><canvas id="c"></canvas></div>
<script type="module">
import { mountHud } from './hud.js';
const hud = mountHud('PROV 2 · RITAD 2D ISOMETRISK');

// Samma värld som prov 1: x längs vägen (horden kommer från +x), z tvärs över.
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');
const mainCtx = ctx;
let W, H, DPR, S, CX, CY;
const INK = '#1b1510';
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

function iso(x, z, y = 0) {
  return [CX + (x - z) * S * 0.866, CY + (x + z) * S * 0.5 - y * S];
}
// ljus från vänster bakom, samma som solen i prov 1
const SUN = [-0.79, 0.6];
const SH = [1.13, -0.87]; // skuggförskjutning per höjdenhet (x, z)

function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function darkHex(c, k) { return '#' + hex(c).map(v => Math.round(v * k).toString(16).padStart(2, '0')).join(''); }
function shade(c, k) { const [r, g, b] = hex(c); const f = v => Math.max(0, Math.min(255, Math.round(v * k))); return `rgb(${f(r)},${f(g)},${f(b)})`; }

function poly(pts, fill, stroke = INK, lw = 2) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function hull(p) {
  p = p.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.reverse()) { while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}

// streckade skuggor
let hatch;
function makeHatch() {
  const c = document.createElement('canvas'); c.width = c.height = 7 * DPR;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(40,28,18,0.30)'; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = 'rgba(30,20,12,0.45)'; g.lineWidth = DPR;
  g.beginPath(); g.moveTo(0, c.height); g.lineTo(c.width, 0); g.stroke();
  hatch = ctx.createPattern(c, 'repeat');
}

// ---------- objekt i världen ----------
function corners(o) {
  const c = Math.cos(o.ry || 0), s = Math.sin(o.ry || 0), hw = o.w / 2, hd = o.d / 2;
  return [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(([a, b]) => [o.x + a * c - b * s, o.z + a * s + b * c]);
}
function boxShadow(o) {
  const base = corners(o), y0 = o.y || 0, h = o.h + y0;
  const pts = [];
  for (const [x, z] of base) { pts.push(iso(x + SH[0] * y0, z + SH[1] * y0)); pts.push(iso(x + SH[0] * h, z + SH[1] * h)); }
  poly(hull(pts), hatch, null);
}
function drawBox(o) {
  const b = corners(o), y0 = o.y || 0, y1 = y0 + o.h;
  for (let i = 0; i < 4; i++) {
    const a = b[i], c = b[(i + 1) % 4];
    const nx = c[1] - a[1], nz = -(c[0] - a[0]);
    const len = Math.hypot(nx, nz), n = [nx / len, nz / len];
    if (n[0] + n[1] <= 0) continue; // vänd bort från kameran
    const light = 0.62 + 0.3 * Math.max(0, n[0] * SUN[0] + n[1] * SUN[1]);
    poly([iso(a[0], a[1], y0), iso(c[0], c[1], y0), iso(c[0], c[1], y1), iso(a[0], a[1], y1)], shade(o.color, light));
  }
  poly(b.map(([x, z]) => iso(x, z, y1)), shade(o.color, 1.08));
}

const world = [];      // statiska saker som djupsorteras
function add(kind, o) { o.kind = kind; world.push(o); return o; }

// bilar = två lådor
function car(x, z, ry, color) {
  add('box', { x, z, w: 4.2, d: 1.9, h: 1.1, ry, color });
  const c = Math.cos(ry), s = Math.sin(ry);
  add('box', { x: x - 0.2 * c, z: z - 0.2 * s, w: 2.2, d: 1.7, h: 0.75, y: 1.1, ry, color: darkHex(color, 0.9), win: true });
}
car(12, 7.5, 0.5, '#7a3526');
car(26, -8, -0.3, '#47463e');
car(-6, -10, 1.3, '#5d6862');
car(38, 6.5, 2.6, '#86744c');
add('box', { x: -10, z: 7, w: 1.0, d: 3, h: 1.05, ry: 0.1, color: '#aca594' });
add('box', { x: -10.6, z: 10.2, w: 1.0, d: 3, h: 1.05, ry: 0.25, color: '#aca594' });
add('box', { x: -19, z: -6.5, w: 1.0, d: 3, h: 1.05, ry: 1.5, color: '#aca594' });
// raserat hus
for (const p of [{ x: -26, z: -18, w: 8, d: 0.4, h: 3.2 }, { x: -30, z: -15, w: 0.4, d: 6, h: 2.4 }, { x: -28, z: -12, w: 3.5, d: 0.4, h: 1.4 }, { x: -22, z: -16.6, w: 0.4, d: 2.5, h: 3.8 }])
  add('box', { ...p, ry: 0.2, color: '#a39580' });
for (const [x, z, c] of [[-12.5, 4.5, '#56633f'], [-13.3, 5.2, '#8a4326'], [-17.5, 5.5, '#36434a'], [16, -6.2, '#56633f']]) add('barrel', { x, z, c });
for (const [x, z, h] of [[4, -11, 5], [20, 12, 6], [-24, 12, 4.5], [44, -12, 5.5]]) {
  const br = []; for (let i = 0; i < 5; i++) br.push({ at: rnd(0.45, 0.95), a: rnd(-2.6, -0.5), l: rnd(0.8, 1.8) });
  add('tree', { x, z, h, br });
}
const poles = [];
for (let x = -40; x <= 60; x += 16) poles.push(add('pole', { x, z: -6.8, h: 7 }));
// taggtråd
const WIRE_X0 = 2, WIRE_X1 = 5;
for (const x of [2.6, 4.4]) add('wire', { x, z: 0, loops: Array.from({ length: 20 }, (_, i) => ({ z: -5.2 + i * 0.55, j: rnd(-0.1, 0.1), r: rnd(0.5, 0.6) })) });
// värnet
const NEST = { x: -14, z: 0 };
const bags = [];
for (let layer = 0; layer < 3; layer++) {
  const r = 2.5 - layer * 0.1, n = 13;
  for (let i = 0; i < n; i++) {
    const a = -1.95 + (i / (n - 1)) * 3.9 + (layer % 2) * 0.15;
    bags.push(add('bag', { x: NEST.x + Math.cos(a) * r, z: NEST.z + Math.sin(a) * r, y: 0.05 + layer * 0.36, a, c: pick(['#9a8b67', '#8a7c5c', '#a69772']) }));
  }
}
const gun = add('gun', { x: NEST.x, z: NEST.z, ang: 0, flash: 0 });
const slot = { x: -9, z: -9 };

// ---------- mark (ritas en gång till en egen duk) ----------
let groundCv, gctx;
const pebbles = Array.from({ length: 320 }, () => ({ x: rnd(-60, 70), z: Math.random() < 0.6 ? (Math.random() < 0.5 ? -1 : 1) * rnd(4.4, 7) : rnd(-30, 30), r: rnd(0.08, 0.25), c: pick(['#7d6f58', '#968767', '#5a5040']) }));
const cracks = Array.from({ length: 40 }, () => { let x = rnd(-50, 60), z = rnd(-30, 30); const p = [[x, z]]; for (let k = 0; k < 6; k++) { x += rnd(-1.2, 1.2); z += rnd(-1.2, 1.2); p.push([x, z]); } return p; });
const tufts = Array.from({ length: 70 }, () => ({ x: rnd(-50, 60), z: (Math.random() < 0.5 ? -1 : 1) * rnd(6, 28) }));

function paintGround() {
  groundCv = document.createElement('canvas'); groundCv.width = W; groundCv.height = H;
  gctx = groundCv.getContext('2d');
  ctx = gctx; // ritfunktionerna ritar nu på markduken
    ctx.fillStyle = '#b39a6c'; ctx.fillRect(0, 0, W, H);
    // rutor med lätt variation, ger tecknad markyta
    for (let x = -60; x < 80; x += 2) for (let z = -40; z < 40; z += 2) {
      const v = (Math.sin(x * 12.9898 + z * 78.233) * 43758.5453) % 1;
      const k = 0.94 + Math.abs(v) * 0.1;
      poly([iso(x, z), iso(x + 2, z), iso(x + 2, z + 2), iso(x, z + 2)], shade('#b39a6c', k), null);
    }
    for (const c of cracks) { ctx.beginPath(); c.forEach(([x, z], i) => { const p = iso(x, z); i ? ctx.lineTo(...p) : ctx.moveTo(...p); }); ctx.strokeStyle = 'rgba(60,45,28,0.45)'; ctx.lineWidth = 1.2; ctx.stroke(); }
    // väg
    poly([iso(-80, -4.5), iso(90, -4.5), iso(90, 4.5), iso(-80, 4.5)], '#4f473c', INK, 2.5);
    for (let x = -80; x < 90; x += 4) poly([iso(x, -0.12), iso(x + 2, -0.12), iso(x + 2, 0.12), iso(x, 0.12)], 'rgba(214,176,86,0.75)', null);
    for (let i = 0; i < 30; i++) { const x = rnd(-50, 60), z = rnd(-4, 4); poly([iso(x, z), iso(x + rnd(0.6, 2), z + rnd(-0.3, 0.3)), iso(x + rnd(0.2, 1), z + rnd(0.3, 0.9))], 'rgba(30,26,22,0.35)', null); }
    for (const p of pebbles) { const [sx, sy] = iso(p.x, p.z); ctx.beginPath(); ctx.ellipse(sx, sy, p.r * S, p.r * S * 0.6, 0, 0, 7); ctx.fillStyle = p.c; ctx.fill(); ctx.lineWidth = 1; ctx.strokeStyle = INK; ctx.stroke(); }
    for (const t of tufts) { const [sx, sy] = iso(t.x, t.z); ctx.strokeStyle = '#5d5a36'; ctx.lineWidth = 1.6; ctx.beginPath(); for (let k = -2; k <= 2; k++) { ctx.moveTo(sx + k * 2, sy); ctx.lineTo(sx + k * 3.2, sy - rnd(5, 9)); } ctx.stroke(); }
    // skuggor från statiska saker
    for (const o of world) staticShadow(o);
  ctx = mainCtx;
  for (const s of splats) paintSplat(s);
}
function staticShadow(o) {
  if (o.kind === 'box') boxShadow(o);
  else if (o.kind === 'barrel') boxShadow({ x: o.x, z: o.z, w: 0.8, d: 0.8, h: 1.2 });
  else if (o.kind === 'pole' || o.kind === 'tree') {
    const a = iso(o.x, o.z), b = iso(o.x + SH[0] * o.h, o.z + SH[1] * o.h);
    ctx.strokeStyle = 'rgba(40,28,18,0.4)'; ctx.lineWidth = S * 0.28; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
  }
}

// blod målas in i marken och blir kvar
const splats = [];
function paintSplat(s) {
  const g = gctx; const [sx, sy] = iso(s.x, s.z);
  g.save(); g.translate(sx, sy); g.scale(1, 0.55);
  g.fillStyle = s.c;
  g.beginPath(); g.arc(0, 0, s.r * S * 0.5, 0, 7); g.fill();
  for (const d of s.drops) { g.beginPath(); g.arc(Math.cos(d.a) * d.d * S, Math.sin(d.a) * d.d * S, d.r * S, 0, 7); g.fill(); }
  g.restore();
}
function splat(x, z, r) {
  const s = { x, z, r, c: pick(['#5e140e', '#4c100b', '#6d1a11']), drops: Array.from({ length: 9 }, () => ({ a: rnd(0, 7), d: rnd(r * 0.3, r * 0.9), r: rnd(0.04, 0.14) })) };
  splats.push(s); if (gctx) paintSplat(s);
}

// ---------- ritning av objekt ----------
function drawObj(o, t) {
  const [sx, sy] = iso(o.x, o.z);
  switch (o.kind) {
    case 'box': {
      drawBox(o);
      if (o.win) { // rutor på bilen
        const b = corners({ ...o, w: o.w * 0.9, d: o.d * 1.02 });
        const y = (o.y || 0) + o.h * 0.75, y2 = (o.y || 0) + o.h * 0.2;
        for (let i = 0; i < 4; i++) {
          const a = b[i], c = b[(i + 1) % 4], nx = c[1] - a[1], nz = -(c[0] - a[0]);
          if (nx + nz <= 0) continue;
          poly([iso(a[0], a[1], y2), iso(c[0], c[1], y2), iso(c[0], c[1], y), iso(a[0], a[1], y)], '#26282a', INK, 1.5);
        }
      }
      break;
    }
    case 'barrel': {
      const r = 0.42 * S, h = 1.2 * S;
      ctx.fillStyle = shade(o.c, 0.8); ctx.fillRect(sx - r * 0.866 * 1.15, sy - h, r * 2 * 0.866 * 1.15, h);
      ctx.beginPath(); ctx.ellipse(sx, sy, r * 1.0, r * 0.58, 0, 0, Math.PI); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sx - r, sy - h); ctx.lineTo(sx - r, sy); ctx.ellipse(sx, sy, r, r * 0.58, 0, Math.PI, 0, true); ctx.lineTo(sx + r, sy - h); ctx.stroke();
      ctx.fillStyle = shade(o.c, 0.62); ctx.fillRect(sx + r * 0.25, sy - h, r * 0.75, h);
      ctx.beginPath(); ctx.ellipse(sx, sy - h, r, r * 0.58, 0, 0, 7); ctx.fillStyle = shade(o.c, 1.1); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx - r, sy - h * 0.55); ctx.ellipse(sx, sy - h * 0.55, r, r * 0.58, 0, Math.PI, 0, true); ctx.lineWidth = 1.2; ctx.stroke();
      break;
    }
    case 'tree': {
      ctx.strokeStyle = INK; ctx.lineCap = 'round';
      ctx.lineWidth = S * 0.3; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - o.h * S); ctx.stroke();
      ctx.lineWidth = S * 0.12;
      for (const b of o.br) { const by = sy - o.h * S * b.at; ctx.beginPath(); ctx.moveTo(sx, by); ctx.lineTo(sx + Math.cos(b.a) * b.l * S * (Math.random() < 0 ? 1 : (b.a < -1.57 ? 1 : 1)), by + Math.sin(b.a) * b.l * S); ctx.stroke(); }
      break;
    }
    case 'pole': {
      ctx.strokeStyle = INK; ctx.lineCap = 'butt';
      ctx.lineWidth = S * 0.3; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy - o.h * S); ctx.stroke();
      ctx.lineWidth = S * 0.16; const [a1, b1] = iso(o.x, o.z - 0.8, o.h - 0.4), [a2, b2] = iso(o.x, o.z + 0.8, o.h - 0.4);
      ctx.beginPath(); ctx.moveTo(a1, b1); ctx.lineTo(a2, b2); ctx.stroke();
      break;
    }
    case 'wire': {
      ctx.strokeStyle = '#2a2622'; ctx.lineWidth = 1.4;
      for (const l of o.loops) { const [lx, ly] = iso(o.x + l.j, l.z, l.r); ctx.beginPath(); ctx.ellipse(lx, ly, l.r * S * 0.55, l.r * S, -0.5, 0, 7); ctx.stroke(); }
      ctx.lineWidth = S * 0.12; ctx.strokeStyle = INK;
      for (let z = -5; z <= 5; z += 2.5) { const [px, py] = iso(o.x, z); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py - 1.3 * S); ctx.stroke(); }
      break;
    }
    case 'bag': {
      const [bx, by] = iso(o.x, o.z, o.y + 0.18);
      ctx.save(); ctx.translate(bx, by); ctx.rotate(-0.2 + Math.sin(o.a) * 0.35);
      ctx.beginPath(); ctx.ellipse(0, 0, S * 0.62, S * 0.3, 0, 0, 7);
      ctx.fillStyle = o.c; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(S * 0.08, S * 0.08, S * 0.5, S * 0.18, 0, 0.2, 2.6); ctx.strokeStyle = 'rgba(40,30,18,0.4)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.restore();
      break;
    }
    case 'gun': drawGun(o); break;
    case 'zombie': drawZombie(o, t); break;
  }
}

function drawGun(o) {
  const base = iso(o.x, o.z, 0);
  // skytt
  const back = iso(o.x - Math.cos(o.ang) * 0.9, o.z - Math.sin(o.ang) * 0.9, 0);
  figure(back[0], back[1], { skin: '#b38c6c', shirt: '#5f6444', pants: '#4f523b', helmet: '#555b3d' }, 0, 0.15, true);
  // trefot
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
  const top = iso(o.x, o.z, 1.15);
  for (const a of [0, 2.1, 4.2]) { const f = iso(o.x + Math.cos(a) * 0.5, o.z + Math.sin(a) * 0.5); ctx.beginPath(); ctx.moveTo(...top); ctx.lineTo(...f); ctx.stroke(); }
  // vapnet
  const tip = iso(o.x + Math.cos(o.ang) * 2.35, o.z + Math.sin(o.ang) * 2.35, 1.18);
  const rear = iso(o.x - Math.cos(o.ang) * 0.4, o.z - Math.sin(o.ang) * 0.4, 1.15);
  const mid = iso(o.x + Math.cos(o.ang) * 0.6, o.z + Math.sin(o.ang) * 0.6, 1.15);
  ctx.lineCap = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = S * 0.42; ctx.beginPath(); ctx.moveTo(...rear); ctx.lineTo(...mid); ctx.stroke();
  ctx.strokeStyle = '#3a3c37'; ctx.lineWidth = S * 0.3; ctx.beginPath(); ctx.moveTo(...rear); ctx.lineTo(...mid); ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = S * 0.14; ctx.beginPath(); ctx.moveTo(...mid); ctx.lineTo(...tip); ctx.stroke();
  if (o.flash > 0.05) {
    const r = S * 1.1 * o.flash;
    const grd = ctx.createRadialGradient(tip[0], tip[1], 0, tip[0], tip[1], r * 4);
    grd.addColorStop(0, `rgba(255,214,140,${0.55 * o.flash})`); grd.addColorStop(1, 'rgba(255,170,80,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(tip[0], tip[1], r * 4, 0, 7); ctx.fill();
    const pts = []; for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283 + o.flashRot, rr = i % 2 ? r * 0.35 : r; pts.push([tip[0] + Math.cos(a) * rr, tip[1] + Math.sin(a) * rr * 0.7]); }
    poly(pts, '#ffe0a0', INK, 1.5);
  }
}

// en tecknad figur: z = zombie (armar framåt), annars soldat
function figure(x, y, col, walk, lean, soldier, big = 1) {
  const u = S * big;
  // skugga
  ctx.fillStyle = 'rgba(40,28,18,0.35)'; ctx.beginPath(); ctx.ellipse(x + u * 0.35, y + u * 0.05, u * 0.55, u * 0.22, -0.4, 0, 7); ctx.fill();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const hip = [x, y - u * 0.9], sw = Math.sin(walk) * u * 0.25;
  // ben
  for (const [dx, s] of [[-0.12, 1], [0.12, -1]]) {
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.3; ctx.beginPath(); ctx.moveTo(hip[0] + dx * u, hip[1]); ctx.lineTo(hip[0] + dx * u + sw * s, y); ctx.stroke();
    ctx.strokeStyle = col.pants; ctx.lineWidth = u * 0.18; ctx.beginPath(); ctx.moveTo(hip[0] + dx * u, hip[1]); ctx.lineTo(hip[0] + dx * u + sw * s, y - 1); ctx.stroke();
  }
  // kropp
  const lx = lean * u * 1.2;
  const torso = [[hip[0] - u * 0.36, hip[1]], [hip[0] + u * 0.36, hip[1]], [hip[0] + u * 0.36 - lx, hip[1] - u * 0.85], [hip[0] - u * 0.36 - lx, hip[1] - u * 0.85]];
  poly(torso, col.shirt, INK, 2);
  poly([torso[1], torso[2], [torso[2][0] - u * 0.22, torso[2][1]], [torso[1][0] - u * 0.22, torso[1][1]]], 'rgba(0,0,0,0.22)', null);
  const sh = [hip[0] - lx - u * 0.1, hip[1] - u * 0.75];
  // armar framåt (mot vänster upp på skärmen = mot -x)
  const reach = soldier ? [u * 0.7, -u * 0.05] : [u * 0.95, -u * 0.35];
  for (const off of [-0.18, 0.2]) {
    const a = [sh[0] + off * u, sh[1]], b = [a[0] - reach[0] + Math.sin(walk + off * 9) * u * 0.08, a[1] + reach[1]];
    ctx.strokeStyle = INK; ctx.lineWidth = u * 0.24; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    ctx.strokeStyle = col.shirt; ctx.lineWidth = u * 0.13; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(b[0] + u * 0.12, b[1] + u * 0.04); ctx.stroke();
    ctx.fillStyle = col.skin; ctx.beginPath(); ctx.arc(b[0], b[1], u * 0.1, 0, 7); ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = INK; ctx.stroke();
  }
  // huvud
  const hx = hip[0] - lx * 1.25 - u * 0.05, hy = hip[1] - u * 1.15;
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(col.tilt || 0);
  poly([[-u * 0.22, -u * 0.24], [u * 0.22, -u * 0.24], [u * 0.22, u * 0.22], [-u * 0.22, u * 0.22]], col.skin, INK, 2);
  if (!soldier) { ctx.fillStyle = INK; ctx.fillRect(-u * 0.15, -u * 0.05, u * 0.08, u * 0.06); ctx.fillStyle = '#4a1510'; ctx.fillRect(-u * 0.1, u * 0.08, u * 0.16, u * 0.05); }
  if (col.helmet) { ctx.beginPath(); ctx.ellipse(0, -u * 0.18, u * 0.3, u * 0.2, 0, Math.PI, 0); ctx.closePath(); ctx.fillStyle = col.helmet; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke(); }
  ctx.restore();
}

function drawZombie(z, t) {
  const [sx, sy] = iso(z.x, z.z);
  if (z.dead) {
    // ligger på marken
    const u = S * z.big;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(0.45);
    poly([[-u * 0.2, -u * 0.25], [u * 1.4, -u * 0.25], [u * 1.4, u * 0.25], [-u * 0.2, u * 0.25]], shade(z.col.shirt, 0.85), INK, 2);
    poly([[u * 1.4, -u * 0.18], [u * 1.8, -u * 0.18], [u * 1.8, u * 0.18], [u * 1.4, u * 0.18]], z.col.skin, INK, 2);
    ctx.restore();
    return;
  }
  figure(sx, sy, z.col, z.t, z.lean + (z.inWire ? 0.12 : 0), false, z.big);
}

// ---------- spel ----------
const SKIN = ['#8d9a74', '#9aa07f', '#7f8a6f', '#a9a283', '#8a8f78'];
const SHIRT = ['#565c69', '#6e5644', '#7a7262', '#4a584b', '#8a4434', '#9a9584', '#3a4762'];
const PANTS = ['#363b4a', '#433d33', '#545042', '#2a2d32'];
const zombies = [];
function spawnZombie(x) {
  const big = Math.random() < 0.12 ? 1.35 : 1;
  zombies.push({ kind: 'zombie', x: x ?? rnd(40, 46), z: rnd(-3.4, 3.4), t: rnd(0, 6), speed: rnd(1.4, 2.3) * (big > 1 ? 0.7 : 1), hp: big > 1 ? 9 : 3, big,
    lean: rnd(0.05, 0.2), dead: false, deadT: 0, col: { skin: pick(SKIN), shirt: pick(SHIRT), pants: pick(PANTS), tilt: rnd(-0.3, 0.3) } });
}
const tracers = [], casings = [], gibs = [];
const WAVE_TOTAL = 40;
let kills = 0, spawned = 0, spawnT = 0, fireT = 0;

function muzzleWorld() { return [gun.x + Math.cos(gun.ang) * 2.35, gun.z + Math.sin(gun.ang) * 2.35, 1.18]; }
function fire(target) {
  const from = muzzleWorld();
  const to = [target.x + rnd(-0.3, 0.3), target.z + rnd(-0.3, 0.3), 1.3 * target.big];
  tracers.push({ from, to, k: 0, len: Math.hypot(to[0] - from[0], to[1] - from[1]), target, hit: Math.random() < 0.8 });
  gun.flash = 1; gun.flashRot = rnd(0, 6);
  casings.push({ x: gun.x, z: gun.z, y: 1.3, vx: rnd(-1.5, 1.5), vz: rnd(-1.5, 1.5), vy: rnd(3, 4.5), life: 6 });
}
function hit(z, p) {
  for (let i = 0; i < 7; i++) gibs.push({ x: p[0], z: p[1], y: p[2], vx: rnd(1, 4), vz: rnd(-2, 2), vy: rnd(1, 4), life: 1.1 });
  if (Math.random() < 0.5) splat(z.x + rnd(0, 1.2), z.z + rnd(-0.6, 0.6), rnd(0.6, 1.3));
  if (--z.hp <= 0 && !z.dead) { z.dead = true; kills++; hud.kill(z.big > 1 ? 3 : 1); splat(z.x + 0.8, z.z, rnd(1.6, 2.6) * z.big); }
}

function resize() {
  DPR = Math.min(devicePixelRatio, 2);
  W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
  const aspect = innerWidth / innerHeight;
  S = (innerHeight * DPR) / (aspect < 1 ? 38 : 25) * 0.95;
  CX = W * 0.5 + 2 * S * 0.866; CY = H * 0.5 + 2 * S * 0.5; // centrera på x = -2
  makeHatch(); paintGround();
}


// ---------- slinga ----------
function step(dt, time) {
  spawnT -= dt;
  if (spawnT <= 0 && spawned < WAVE_TOTAL) { spawnZombie(); spawned++; spawnT = rnd(0.5, 1.6); }
  if (spawned >= WAVE_TOTAL && zombies.every(z => z.dead)) { spawned = 0; kills = 0; }
  hud.progress(kills, WAVE_TOTAL);
  let target = null, best = 32;
  for (const z of zombies) {
    if (z.dead) { z.deadT += dt; continue; }
    z.inWire = z.x > WIRE_X0 && z.x < WIRE_X1;
    const sp = z.speed * (z.inWire ? 0.3 : 1);
    z.t += dt * sp * 2.6; z.x -= sp * dt;
    z.z += Math.sin(z.t * 0.5) * dt * 0.3 + (z.inWire ? Math.sin(time * 9 + z.t) * dt * 0.6 : 0);
    if (z.x < -11) z.x = rnd(40, 46);
    const d = Math.hypot(z.x - NEST.x, z.z - NEST.z);
    if (d < best) { best = d; target = z; }
  }
  for (let i = zombies.length - 1; i >= 0; i--) if (zombies[i].dead && zombies[i].deadT > 14) zombies.splice(i, 1);
  if (target) {
    const want = Math.atan2(target.z - NEST.z, target.x - NEST.x);
    let diff = want - gun.ang; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    gun.ang += diff * Math.min(1, dt * 8);
    fireT -= dt;
    if (fireT <= 0 && Math.abs(diff) < 0.25) { fire(target); fireT = 0.11; }
  }
  gun.flash *= 0.55;
  for (let i = tracers.length - 1; i >= 0; i--) {
    const tr = tracers[i]; tr.k += dt * 90 / tr.len;
    if (tr.k >= 1) { tracers.splice(i, 1); if (tr.hit && !tr.target.dead) hit(tr.target, tr.to); }
  }
  for (let i = casings.length - 1; i >= 0; i--) {
    const c = casings[i];
    if (c.y > 0.04 || Math.abs(c.vy) > 0.4) {
      c.vy -= 22 * dt; c.x += c.vx * dt; c.z += c.vz * dt; c.y += c.vy * dt;
      if (c.y < 0.04) { c.y = 0.04; c.vx *= 0.3; c.vz *= 0.3; c.vy *= -0.3; }
    }
    c.life -= dt; if (c.life <= 0) casings.splice(i, 1);
  }
  for (let i = gibs.length - 1; i >= 0; i--) {
    const g = gibs[i]; g.vy -= 18 * dt; g.x += g.vx * dt; g.z += g.vz * dt; g.y = Math.max(0.05, g.y + g.vy * dt);
    if (g.y <= 0.05) g.vx = g.vz = 0;
    g.life -= dt; if (g.life <= 0) gibs.splice(i, 1);
  }
}

function render(time) {
  ctx.drawImage(groundCv, 0, 0);
  // döda först (de ligger på marken), sedan allt annat djupsorterat
  for (const z of zombies) if (z.dead) drawZombie(z, time);
  const items = world.concat(zombies.filter(z => !z.dead));
  items.sort((a, b) => (a.x + a.z) - (b.x + b.z));
  // tom position
  const [rx, ry] = iso(slot.x, slot.z);
  ctx.save(); ctx.setLineDash([8, 6]); ctx.lineWidth = 2.5; ctx.strokeStyle = `rgba(233,223,201,${0.35 + Math.sin(time * 2.5) * 0.15})`;
  ctx.beginPath(); ctx.ellipse(rx, ry, 2.2 * S * 0.866 * 1.15, 2.2 * S * 0.5 * 1.15, 0, 0, 7); ctx.stroke();
  ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(rx - S * 0.6, ry); ctx.lineTo(rx + S * 0.6, ry); ctx.moveTo(rx, ry - S * 0.35); ctx.lineTo(rx, ry + S * 0.35); ctx.stroke();
  ctx.restore();
  for (const o of items) {
    drawObj(o, time);
  }
  // ledningar mellan stolparna
  ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
  for (let i = 0; i < poles.length - 1; i++) {
    const a = iso(poles[i].x, poles[i].z, 6.6), b = iso(poles[i + 1].x, poles[i + 1].z, 6.6);
    ctx.beginPath(); ctx.moveTo(...a); ctx.quadraticCurveTo((a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + S * 1.2, ...b); ctx.stroke();
  }
  // spårljus
  ctx.lineCap = 'round';
  for (const tr of tracers) {
    const k0 = Math.max(0, tr.k - 1.6 / tr.len), k1 = tr.k;
    const p0 = iso(tr.from[0] + (tr.to[0] - tr.from[0]) * k0, tr.from[1] + (tr.to[1] - tr.from[1]) * k0, tr.from[2] + (tr.to[2] - tr.from[2]) * k0);
    const p1 = iso(tr.from[0] + (tr.to[0] - tr.from[0]) * k1, tr.from[1] + (tr.to[1] - tr.from[1]) * k1, tr.from[2] + (tr.to[2] - tr.from[2]) * k1);
    ctx.strokeStyle = 'rgba(255,190,90,0.35)'; ctx.lineWidth = S * 0.35; ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.stroke();
    ctx.strokeStyle = '#ffe2a8'; ctx.lineWidth = S * 0.1; ctx.beginPath(); ctx.moveTo(...p0); ctx.lineTo(...p1); ctx.stroke();
  }
  for (const c of casings) { const [x, y] = iso(c.x, c.z, c.y); ctx.fillStyle = '#c9a046'; ctx.fillRect(x - 2, y - 1, 4, 2); }
  for (const g of gibs) { const [x, y] = iso(g.x, g.z, g.y); ctx.fillStyle = '#5e130d'; ctx.fillRect(x - 2.5, y - 2.5, 5, 5); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  step(dt, now / 1000);
  render(now / 1000);
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
for (let i = 0; i < 14; i++) { spawnZombie(rnd(8, 40)); spawned++; }
requestAnimationFrame(frame);
</script>
</body>
</html>
