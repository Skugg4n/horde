<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horde · prov 1 (3D-iso)</title>
<link rel="stylesheet" href="hud.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="stage" class="grade"></div>
<script type="module">
import * as THREE from 'three';
import { mountHud } from './hud.js';

const hud = mountHud('PROV 1 · 3D ISOMETRISK');

// ---------- grund ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const HAZE = new THREE.Color('#b9aa8c');
const scene = new THREE.Scene();
scene.background = HAZE;
scene.fog = new THREE.Fog(HAZE, 70, 120);

const VIEW = 25;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
camera.position.set(38, 46, 40);
camera.lookAt(-2, 0, 0);
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h);
  const v = a < 1 ? VIEW * 1.5 : VIEW;
  camera.left = -v * a / 2; camera.right = v * a / 2; camera.top = v / 2; camera.bottom = -v / 2;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// Låg eftermiddagssol: långa skuggor över vägen
scene.add(new THREE.HemisphereLight('#d6dbe0', '#5b4a35', 0.75));
const sun = new THREE.DirectionalLight('#ffdcae', 2.6);
sun.position.set(-34, 30, 26);
sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 160 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

// ---------- hjälpare ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const matCache = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!matCache.has(key)) matCache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0, flatShading: true, ...opts }));
  return matCache.get(key);
}
function mesh(geo, m, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(geo, m);
  o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true;
  return o;
}
const box = (w, h, d, m, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y, z);

function canvasTex(size, draw, repeat = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  t.anisotropy = 8;
  return t;
}
function speckle(g, s, n, colors, rMax) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = pick(colors); g.globalAlpha = rnd(0.15, 0.6);
    g.beginPath(); g.arc(Math.random() * s, Math.random() * s, rnd(0.5, rMax), 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}

// ---------- mark ----------
const dirt = canvasTex(512, (g, s) => {
  g.fillStyle = '#8c7b5c'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 40; i++) {
    const grd = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    const x = Math.random() * s, y = Math.random() * s, r = rnd(30, 110);
    g.save(); g.translate(x, y); g.scale(r, r * rnd(0.5, 1));
    grd.addColorStop(0, pick(['rgba(70,58,40,0.16)', 'rgba(150,135,100,0.18)', 'rgba(95,100,70,0.14)']));
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(0, 0, 1, 0, 7); g.fill(); g.restore();
  }
  speckle(g, s, 5000, ['#5e5039', '#a3936f', '#6d6a4b', '#3f362a'], 2.2);
  g.strokeStyle = 'rgba(50,40,28,0.35)'; g.lineWidth = 1;
  for (let i = 0; i < 18; i++) {
    let x = Math.random() * s, y = Math.random() * s; g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 8; k++) { x += rnd(-18, 18); y += rnd(-18, 18); g.lineTo(x, y); }
    g.stroke();
  }
}, 7);
const ground = mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: dirt, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.castShadow = false;
scene.add(ground);

const asphalt = canvasTex(512, (g, s) => {
  g.fillStyle = '#45413a'; g.fillRect(0, 0, s, s);
  speckle(g, s, 7000, ['#2d2a25', '#5a554b', '#3a3630', '#6b6456'], 1.6);
  g.strokeStyle = 'rgba(20,18,14,0.6)'; g.lineWidth = 1.5;
  for (let i = 0; i < 10; i++) {
    let x = Math.random() * s, y = Math.random() * s; g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += rnd(-30, 30); y += rnd(-10, 10); g.lineTo(x, y); }
    g.stroke();
  }
  // blekt mittlinje
  g.fillStyle = 'rgba(205,170,80,0.55)';
  for (let x = 0; x < s; x += 128) g.fillRect(x + 10, s / 2 - 5, 70, 10);
  speckle(g, s, 600, ['#45413a'], 3);
});
asphalt.repeat.set(16, 1);
const road = mesh(new THREE.PlaneGeometry(160, 9), new THREE.MeshStandardMaterial({ map: asphalt, roughness: 0.95 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.02; road.castShadow = false;
scene.add(road);

// grus i vägkanten
for (let i = 0; i < 260; i++) {
  const side = Math.random() < 0.5 ? -1 : 1;
  const r = mesh(new THREE.DodecahedronGeometry(rnd(0.08, 0.28), 0), mat(pick(['#6f6352', '#8a7d65', '#4f473b'])),
    rnd(-70, 70), 0.05, side * rnd(4.4, 6.5));
  r.rotation.set(rnd(0, 3), rnd(0, 3), 0);
  scene.add(r);
}

// ---------- blodstänk ----------
const splatTex = canvasTex(128, (g, s) => {
  g.translate(s / 2, s / 2);
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(0, 0, 26, 0, 7); g.fill();
  for (let i = 0; i < 26; i++) {
    const a = rnd(0, 7), d = rnd(18, 58), r = rnd(2, 10) * (1 - d / 70);
    g.beginPath(); g.arc(Math.cos(a) * d, Math.sin(a) * d, Math.max(1, r), 0, 7); g.fill();
  }
});
const decals = [];
function splat(x, z, size) {
  const m = new THREE.MeshStandardMaterial({
    color: pick(['#5b120d', '#4a0f0b', '#6a1810']), alphaMap: splatTex, transparent: true,
    roughness: 0.35, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2,
  });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(size, size), m);
  p.rotation.set(-Math.PI / 2, 0, rnd(0, 7));
  p.position.set(x, 0.03 + decals.length * 0.0004 % 0.02, z);
  p.receiveShadow = true;
  scene.add(p); decals.push(p);
  if (decals.length > 140) { const old = decals.shift(); scene.remove(old); }
}

// ---------- rekvisita ----------
function car(x, z, ry, body, burnt = false) {
  const g = new THREE.Group();
  const b = mat(body, { roughness: burnt ? 1 : 0.7, metalness: burnt ? 0 : 0.25 });
  g.add(box(4.2, 0.9, 1.9, b, 0, 0.75, 0));
  g.add(box(2.2, 0.75, 1.75, b, -0.2, 1.55, 0));
  g.add(box(2.0, 0.55, 1.8, mat('#1d1c1a', { roughness: 0.3, metalness: 0.4 }), -0.2, 1.55, 0));
  for (const [wx, wz] of [[-1.35, 0.95], [1.35, 0.95], [-1.35, -0.95], [1.35, -0.95]]) {
    const w = mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.3, 10), mat('#151413'), wx, 0.42, wz);
    w.rotation.x = Math.PI / 2; g.add(w);
  }
  if (burnt) g.children[0].scale.y = 0.85;
  g.position.set(x, burnt ? -0.12 : 0, z); g.rotation.set(0, ry, burnt ? 0.05 : 0);
  scene.add(g);
}
car(12, 7.5, 0.5, '#6b2f22');
car(26, -8, -0.3, '#3a3a33', true);
car(-6, -10, 1.3, '#56605a');
car(38, 6.5, 2.6, '#7b6a45');

function jersey(x, z, ry) {
  const g = new THREE.Group();
  const shape = new THREE.Shape();
  shape.moveTo(-0.55, 0); shape.lineTo(0.55, 0); shape.lineTo(0.3, 0.35); shape.lineTo(0.18, 1.05);
  shape.lineTo(-0.18, 1.05); shape.lineTo(-0.3, 0.35); shape.lineTo(-0.55, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 3, bevelEnabled: false });
  geo.translate(0, 0, -1.5);
  g.add(mesh(geo, mat('#a59f90')));
  g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
}
jersey(-10, 7, 0.1); jersey(-10.6, 10.2, 0.25); jersey(-19, -6.5, 1.5);

function barrel(x, z, c = '#4d5a3d', tipped = false) {
  const b = mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.2, 12), mat(c, { roughness: 0.8, metalness: 0.2 }), x, tipped ? 0.45 : 0.6, z);
  if (tipped) b.rotation.set(Math.PI / 2, 0, rnd(0, 3));
  scene.add(b);
}
barrel(-12.5, 4.5); barrel(-13.3, 5.2, '#7a3b22'); barrel(16, -6.2, '#4d5a3d', true); barrel(-17.5, 5.5, '#2f3a40');

function deadTree(x, z, h) {
  const g = new THREE.Group(); const bark = mat('#2c2620');
  g.add(mesh(new THREE.CylinderGeometry(0.12, 0.32, h, 6), bark, 0, h / 2, 0));
  for (let i = 0; i < 5; i++) {
    const l = rnd(1, 2.4);
    const br = mesh(new THREE.CylinderGeometry(0.04, 0.1, l, 5), bark, 0, h * rnd(0.45, 0.95), 0);
    br.rotation.set(rnd(-1.1, 1.1), rnd(0, 6), rnd(-1.1, 1.1));
    br.translateY(l / 2); g.add(br);
  }
  g.position.set(x, 0, z); scene.add(g);
}
deadTree(4, -11, 5); deadTree(20, 12, 6); deadTree(-24, 12, 4.5); deadTree(44, -12, 5.5);

// telefonstolpar längs vägen
const poles = [];
for (let x = -40; x <= 60; x += 16) {
  const p = mesh(new THREE.CylinderGeometry(0.13, 0.17, 7, 6), mat('#3b2f24'), x, 3.5, -6.8);
  p.rotation.z = rnd(-0.06, 0.06); scene.add(p);
  scene.add(box(1.6, 0.12, 0.12, mat('#3b2f24'), x, 6.6, -6.8));
  poles.push(new THREE.Vector3(x, 6.55, -6.8));
}
for (let i = 0; i < poles.length - 1; i++) {
  const a = poles[i], b = poles[i + 1], pts = [];
  for (let k = 0; k <= 12; k++) { const t = k / 12; pts.push(new THREE.Vector3(a.x + (b.x - a.x) * t, a.y - Math.sin(t * Math.PI) * 0.9, a.z)); }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: '#1e1a16' })));
}

// raserat hus
(function ruin() {
  const g = new THREE.Group(), wall = mat('#9a8d78'), dark = mat('#5d5245');
  g.add(box(8, 3.2, 0.4, wall, 0, 1.6, -3));
  g.add(box(0.4, 2.4, 6, wall, -4, 1.2, 0));
  g.add(box(3.5, 1.4, 0.4, wall, -2.2, 0.7, 3));
  g.add(box(0.4, 3.8, 2.5, wall, 4, 1.9, -1.8));
  g.add(box(8, 0.2, 6, dark, 0, 0.1, 0));
  for (let i = 0; i < 14; i++) {
    const r = mesh(new THREE.BoxGeometry(rnd(0.3, 1), rnd(0.2, 0.5), rnd(0.3, 0.8)), pick([wall, dark]), rnd(-3, 4), 0.25, rnd(-2, 3.5));
    r.rotation.set(rnd(0, 1), rnd(0, 3), rnd(0, 1)); g.add(r);
  }
  g.position.set(-26, 0, -15); g.rotation.y = 0.2; scene.add(g);
})();

// ---------- taggtråd (saktar ner) ----------
const WIRE_X0 = 2, WIRE_X1 = 5;
(function wire() {
  const steel = mat('#3c3a36', { metalness: 0.6, roughness: 0.5 });
  for (const x of [2.6, 4.4]) {
    for (let z = -5.2; z <= 5.2; z += 0.55) {
      const t = mesh(new THREE.TorusGeometry(0.55, 0.025, 4, 18), steel, x + rnd(-0.1, 0.1), 0.55, z);
      t.rotation.set(rnd(-0.2, 0.2), Math.PI / 2 + rnd(-0.3, 0.3), 0); scene.add(t);
    }
  }
  for (let z = -5; z <= 5; z += 2.5) {
    for (const x of [2.6, 4.4]) {
      const p = mesh(new THREE.BoxGeometry(0.1, 1.3, 0.1), mat('#4a3a2a'), x, 0.65, z);
      p.rotation.z = rnd(-0.15, 0.15); scene.add(p);
    }
  }
})();

// ---------- figurer ----------
function humanoid({ skin, shirt, pants, helmet }) {
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  const hipL = new THREE.Group(), hipR = new THREE.Group();
  hipL.position.set(-0.18, 0.85, 0); hipR.position.set(0.18, 0.85, 0);
  hipL.add(box(0.27, 0.85, 0.3, mat(pants), 0, -0.42, 0));
  hipR.add(box(0.27, 0.85, 0.3, mat(pants), 0, -0.42, 0));
  const torso = box(0.72, 0.85, 0.42, mat(shirt), 0, 1.3, 0);
  const head = box(0.42, 0.45, 0.42, mat(skin), 0, 1.98, 0.03);
  const shL = new THREE.Group(), shR = new THREE.Group();
  shL.position.set(-0.47, 1.62, 0); shR.position.set(0.47, 1.62, 0);
  shL.add(box(0.2, 0.75, 0.22, mat(shirt), 0, -0.3, 0)); shL.add(box(0.17, 0.2, 0.18, mat(skin), 0, -0.75, 0));
  shR.add(box(0.2, 0.75, 0.22, mat(shirt), 0, -0.3, 0)); shR.add(box(0.17, 0.2, 0.18, mat(skin), 0, -0.75, 0));
  body.add(hipL, hipR, torso, head, shL, shR);
  if (helmet) {
    const h = mesh(new THREE.SphereGeometry(0.3, 8, 5, 0, Math.PI * 2, 0, Math.PI / 2), mat(helmet), 0, 2.1, 0.03);
    h.scale.set(1.05, 0.8, 1.1); body.add(h);
  }
  return { root, body, hipL, hipR, shL, shR, head };
}

// ---------- kulsprutevärn ----------
const NEST = new THREE.Vector3(-14, 0, 0);
const gunPivot = new THREE.Group();
const muzzle = new THREE.Object3D();
let flashLight, flashMesh;
(function nest() {
  const g = new THREE.Group();
  const bag = [mat('#8f8160'), mat('#7f7254'), mat('#9a8c6a')];
  for (let layer = 0; layer < 3; layer++) {
    const r = 2.5 - layer * 0.1, n = 13;
    for (let i = 0; i < n; i++) {
      const a = -1.95 + (i / (n - 1)) * 3.9 + (layer % 2) * 0.15;
      const s = mesh(new THREE.SphereGeometry(0.5, 7, 5), pick(bag), Math.cos(a) * r, 0.28 + layer * 0.36, Math.sin(a) * r);
      s.scale.set(0.95, 0.42, 0.55); s.rotation.y = -a; g.add(s);
    }
  }
  // gevär på trefot
  const metal = mat('#2a2b28', { metalness: 0.55, roughness: 0.45 });
  for (let i = 0; i < 3; i++) {
    const l = mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.3, 5), metal);
    const a = i * 2.1; l.position.set(Math.cos(a) * 0.35, 0.55, Math.sin(a) * 0.35);
    l.rotation.set(Math.sin(a) * 0.45, 0, -Math.cos(a) * 0.45); g.add(l);
  }
  gunPivot.position.set(0, 1.15, 0); g.add(gunPivot);
  gunPivot.add(box(1.1, 0.32, 0.3, metal, 0.1, 0, 0));
  gunPivot.add(box(0.4, 0.25, 0.32, mat('#4d4f3a'), -0.1, -0.25, 0.25)); // ammolåda
  const barrel = mesh(new THREE.CylinderGeometry(0.05, 0.06, 1.6, 6), metal, 1.4, 0.03, 0);
  barrel.rotation.z = Math.PI / 2; gunPivot.add(barrel);
  gunPivot.add(box(0.22, 0.22, 0.22, metal, 2.2, 0.03, 0));
  muzzle.position.set(2.35, 0.03, 0); gunPivot.add(muzzle);

  flashLight = new THREE.PointLight('#ffb15c', 0, 14, 1.6);
  muzzle.add(flashLight);
  flashMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.7), new THREE.MeshBasicMaterial({ color: '#ffd391', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  flashMesh.position.x = 0.5; muzzle.add(flashMesh);

  const gunner = humanoid({ skin: '#a58467', shirt: '#55593f', pants: '#4a4d38', helmet: '#4f5438' });
  gunner.root.position.set(-0.9, -1.15, 0); gunner.root.rotation.y = Math.PI / 2;
  gunner.shL.rotation.x = -1.2; gunner.shR.rotation.x = -1.2; gunner.body.rotation.x = 0.25;
  gunPivot.add(gunner.root);

  g.position.copy(NEST); scene.add(g);
})();

// tom position: streckad ring på marken
(function emptySlot() {
  const ring = new THREE.Mesh(new THREE.RingGeometry(2.1, 2.3, 48, 1, 0, Math.PI * 2),
    new THREE.MeshBasicMaterial({ color: '#e9dfc9', transparent: true, opacity: 0.35, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(-9, 0.05, -9);
  scene.add(ring);
  const plus = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 1.4), ring.material); plus.rotation.x = -Math.PI / 2; plus.position.set(-9, 0.06, -9);
  const plus2 = plus.clone(); plus2.rotation.z = Math.PI / 2;
  scene.add(plus, plus2);
  window.__ring = ring;
})();

// ---------- zombier ----------
const zombies = [];
const SKIN = ['#7e8a69', '#8b8f73', '#6f7962', '#9b9477', '#7a7f6c'];
const SHIRT = ['#4a4f5a', '#5e4a3a', '#6b6455', '#3d4a3f', '#7a3b2e', '#8a8577', '#2f3b52'];
const PANTS = ['#2f3340', '#3a352c', '#4a4538', '#24272b'];
function spawnZombie(x) {
  const h = humanoid({ skin: pick(SKIN), shirt: pick(SHIRT), pants: pick(PANTS) });
  h.root.position.set(x ?? rnd(40, 46), 0, rnd(-3.4, 3.4));
  h.root.rotation.y = -Math.PI / 2 + rnd(-0.15, 0.15);
  h.shL.rotation.x = -1.3 + rnd(-0.2, 0.2); h.shR.rotation.x = -1.2 + rnd(-0.3, 0.2);
  h.head.rotation.set(rnd(-0.1, 0.3), 0, rnd(-0.35, 0.35));
  h.body.rotation.x = rnd(0.05, 0.2);
  const big = Math.random() < 0.12;
  if (big) h.root.scale.setScalar(1.35);
  scene.add(h.root);
  zombies.push({ ...h, hp: big ? 9 : 3, speed: rnd(1.4, 2.3) * (big ? 0.7 : 1), t: rnd(0, 6), dead: false, deadT: 0, lean: h.body.rotation.x, big });
}

// ---------- skott, hylsor, stänk ----------
const tracers = [], casings = [], gibs = [];
const tracerGeo = new THREE.BoxGeometry(1.6, 0.06, 0.06);
const tracerMat = new THREE.MeshBasicMaterial({ color: '#ffcc80' });
const casingGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.14, 5);
const casingMat = mat('#b08a3a', { metalness: 0.8, roughness: 0.35 });
const gibGeo = new THREE.BoxGeometry(0.09, 0.09, 0.09);
const gibMat = new THREE.MeshStandardMaterial({ color: '#5e130d', roughness: 0.4 });

function fire(target) {
  const from = new THREE.Vector3(); muzzle.getWorldPosition(from);
  const to = target.root.position.clone(); to.y = 1.3 * target.root.scale.y;
  to.x += rnd(-0.3, 0.3); to.z += rnd(-0.3, 0.3);
  const tr = new THREE.Mesh(tracerGeo, tracerMat);
  tr.position.copy(from); tr.lookAt(to); tr.rotateY(Math.PI / 2);
  scene.add(tr);
  tracers.push({ m: tr, from, to, t: 0, len: from.distanceTo(to), target, hit: Math.random() < 0.8 });
  flashLight.intensity = 60; flashMesh.material.opacity = 1; flashMesh.rotation.x = rnd(0, 3);
  const c = new THREE.Mesh(casingGeo, casingMat); c.castShadow = true;
  muzzle.parent.localToWorld(c.position.set(0.1, 0.2, 0));
  scene.add(c);
  casings.push({ m: c, v: new THREE.Vector3(rnd(-1.5, 1.5), rnd(3, 4.5), rnd(-1.5, 1.5)), life: 6, rest: false });
}

function hitZombie(z, p) {
  for (let i = 0; i < 8; i++) {
    const g = new THREE.Mesh(gibGeo, gibMat); g.position.copy(p); scene.add(g);
    gibs.push({ m: g, v: new THREE.Vector3(rnd(1, 4), rnd(1, 4), rnd(-2, 2)), life: 1.2 });
  }
  if (Math.random() < 0.5) splat(z.root.position.x + rnd(0, 1.2), z.root.position.z + rnd(-0.6, 0.6), rnd(0.6, 1.4));
  if (--z.hp <= 0 && !z.dead) {
    z.dead = true; kills++; hud.kill(z.big ? 3 : 1);
    splat(z.root.position.x + 0.8, z.root.position.z, rnd(1.6, 2.6) * z.root.scale.x);
  }
}

// ---------- damm i luften ----------
const dustN = 500, dustPos = new Float32Array(dustN * 3);
for (let i = 0; i < dustN; i++) { dustPos[i * 3] = rnd(-50, 70); dustPos[i * 3 + 1] = rnd(0.2, 9); dustPos[i * 3 + 2] = rnd(-40, 40); }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustTex = canvasTex(32, (g, s) => { const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, s, s); });
scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({ size: 0.35, map: dustTex, color: '#efe2c4', transparent: true, opacity: 0.45, depthWrite: false })));

// ---------- loop ----------
const WAVE_TOTAL = 40;
let kills = 0, spawned = 0, spawnT = 0, fireT = 0;
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  spawnT -= dt;
  if (spawnT <= 0 && spawned < WAVE_TOTAL) { spawnZombie(); spawned++; spawnT = rnd(0.5, 1.6); }
  if (spawned >= WAVE_TOTAL && zombies.every(z => z.dead)) { spawned = 0; kills = 0; }
  hud.progress(kills, WAVE_TOTAL);

  // zombier går
  let target = null, best = 32;
  for (const z of zombies) {
    const p = z.root.position;
    if (z.dead) {
      z.deadT += dt;
      z.body.rotation.x = Math.max(-Math.PI / 2, z.body.rotation.x - dt * 5);
      z.body.position.y = Math.max(-0.22, z.body.position.y - dt);
      continue;
    }
    const inWire = p.x > WIRE_X0 && p.x < WIRE_X1;
    const sp = z.speed * (inWire ? 0.3 : 1);
    z.t += dt * sp * 2.6;
    p.x -= sp * dt;
    p.z += Math.sin(z.t * 0.5) * dt * 0.3 + (inWire ? Math.sin(time * 9 + z.t) * dt * 0.6 : 0);
    z.hipL.rotation.x = Math.sin(z.t) * 0.55; z.hipR.rotation.x = -Math.sin(z.t) * 0.55;
    z.body.rotation.z = Math.sin(z.t) * 0.08;
    z.body.rotation.x = z.lean + (inWire ? 0.25 : 0);
    if (p.x < -11) { p.x = rnd(40, 46); } // når basen: börjar om (provet har ingen förlust)
    const d = p.distanceTo(NEST);
    if (d < best) { best = d; target = z; }
  }
  // städa gamla lik
  for (let i = zombies.length - 1; i >= 0; i--) if (zombies[i].dead && zombies[i].deadT > 14) { scene.remove(zombies[i].root); zombies.splice(i, 1); }

  // kulspruta
  if (target) {
    tmp.copy(target.root.position).sub(NEST);
    const want = Math.atan2(-tmp.z, tmp.x);
    let diff = want - gunPivot.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    gunPivot.rotation.y += diff * Math.min(1, dt * 8);
    fireT -= dt;
    if (fireT <= 0 && Math.abs(diff) < 0.25) { fire(target); fireT = 0.11; }
  }
  flashLight.intensity *= 0.55; flashMesh.material.opacity *= 0.5;

  for (let i = tracers.length - 1; i >= 0; i--) {
    const t = tracers[i]; t.t += dt * 90;
    const k = Math.min(1, t.t / t.len);
    t.m.position.lerpVectors(t.from, t.to, k);
    if (k >= 1) {
      scene.remove(t.m); tracers.splice(i, 1);
      if (t.hit && !t.target.dead) hitZombie(t.target, t.to);
    }
  }
  for (let i = casings.length - 1; i >= 0; i--) {
    const c = casings[i];
    if (!c.rest) {
      c.v.y -= 22 * dt; c.m.position.addScaledVector(c.v, dt); c.m.rotation.x += dt * 14;
      if (c.m.position.y < 0.04) { c.m.position.y = 0.04; c.v.multiplyScalar(0.3); c.v.y *= -1; if (Math.abs(c.v.y) < 0.4) { c.rest = true; c.m.rotation.set(Math.PI / 2, 0, rnd(0, 6)); } }
    }
    c.life -= dt; if (c.life <= 0) { scene.remove(c.m); casings.splice(i, 1); }
  }
  for (let i = gibs.length - 1; i >= 0; i--) {
    const g = gibs[i]; g.v.y -= 18 * dt; g.m.position.addScaledVector(g.v, dt);
    if (g.m.position.y < 0.05) { g.m.position.y = 0.05; g.v.set(0, 0, 0); }
    g.life -= dt; if (g.life <= 0) { scene.remove(g.m); gibs.splice(i, 1); }
  }

  for (let i = 0; i < dustN; i++) {
    dustPos[i * 3] += dt * 0.8; dustPos[i * 3 + 1] += Math.sin(time + i) * dt * 0.05;
    if (dustPos[i * 3] > 70) dustPos[i * 3] = -50;
  }
  dustGeo.attributes.position.needsUpdate = true;
  window.__ring.material.opacity = 0.25 + Math.sin(time * 2.5) * 0.12;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
for (let i = 0; i < 14; i++) { spawnZombie(rnd(8, 40)); spawned++; }
tick();
</script>
