<!doctype html>
<html lang="sv"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horde · visningssida</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lb { position: absolute; transform: translate(-50%, 0); white-space: nowrap; font-size: 12px; letter-spacing: 0.08em;
        padding: 2px 7px; background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 2px; }
  .lb small { color: var(--paper-dim); letter-spacing: 0.04em; }
  #head { position: fixed; top: 14px; left: 14px; padding: 8px 14px 10px; }
  #head .t { font-family: 'Saira Stencil One', sans-serif; font-size: 26px; line-height: 1.1; }
  #head .s { font-size: 12px; color: var(--paper-dim); letter-spacing: 0.06em; margin-top: 2px; }
  #head button { margin-top: 8px; font: 600 12px 'Oswald', sans-serif; letter-spacing: 0.08em; color: var(--paper);
        background: rgba(233,223,201,0.08); border: 1px solid var(--plate-edge); padding: 4px 10px; cursor: pointer; }
  #head button:hover { background: rgba(181,83,42,0.25); }
  #stage { cursor: grab; }
</style>
</head><body>
<div id="stage" class="grade"></div>
<div id="labels"></div>
<div id="head" class="plate">
  <div class="t">VISNINGSSIDA</div>
  <div class="s">Alla modeller under spelets ljus. Dra för att flytta, hjul för att zooma.</div>
  <button id="zoom">Spelets avstånd</button>
</div>
<div id="ver"></div>
<script type="module">
import * as THREE from 'three';
import { VERSION } from './src/version.js';
import { createScene } from './src/render/scene.js';
import { dirtTexture } from './src/render/world.js';
import { mesh } from './src/render/kit.js';
import { weaponModel, obstacleModel, setObstacleWear, zombieModel, zombieWalk, slotMarker, baseModel } from './src/render/models.js';
import { WEAPONS } from './src/data/weapons.js';
import { OBSTACLES } from './src/data/obstacles.js';
import { ZOMBIES } from './src/data/zombies.js';
import { asphaltTexture } from './src/render/world.js';

document.getElementById('ver').textContent = 'v' + VERSION;
const OVERVIEW = 44, GAME = 25;
const map = { camera: { target: [0, 0], view: OVERVIEW } };
const { renderer, scene, camera } = createScene(document.getElementById('stage'), map);

// samma kamera-offset som spelet, men flyttbar och zoombar
const OFFSET = new THREE.Vector3(40, 46, 40);
const target = new THREE.Vector3(0, 0, 0);
let view = OVERVIEW;
function applyCamera() {
  const a = innerWidth / innerHeight, v = a < 1 ? view * 1.5 : view;
  camera.left = -v * a / 2; camera.right = v * a / 2; camera.top = v / 2; camera.bottom = -v / 2;
  camera.position.copy(target).add(OFFSET); camera.lookAt(target);
  camera.updateProjectionMatrix();
}
addEventListener('resize', applyCamera); applyCamera();

// mark
const ground = mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: dirtTexture(), roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.castShadow = false; scene.add(ground);
const asphalt = asphaltTexture(); asphalt.repeat.set(1, 1);

// rutnät i bildens riktning: u åt höger, v nedåt (isometriskt)
const R = new THREE.Vector3(1, 0, -1).normalize(), D = new THREE.Vector3(1, 0, 1).normalize();
const at = (u, v) => R.clone().multiplyScalar(u).add(D.clone().multiplyScalar(v));
const labels = [];
function label(u, v, text, sub, drop = 0) {
  const el = document.createElement('div'); el.className = 'lb';
  el.innerHTML = text + (sub ? ` <small>${sub}</small>` : '');
  document.getElementById('labels').appendChild(el);
  labels.push({ el, p: at(u, v + drop) });
}

// rad 1: vapen nivå 1 till 3
const WV = -15;
[['m249', -22], ['m2', 3]].forEach(([t, u0]) => {
  for (let lv = 1; lv <= 3; lv++) {
    const w = weaponModel(t, lv);
    w.group.position.copy(at(u0 + (lv - 1) * 8, WV));
    w.pivot.rotation.y = -0.35;                                           // siktar lite mot vägen
    scene.add(w.group);
    label(u0 + (lv - 1) * 8, WV, WEAPONS[t].name, 'nivå ' + lv, 4.6);
  }
});

// rad 2: hinder på en vägbit, hela och halvslitna
const OV = 1;
[['wire', 1, -21], ['wire', 0.5, -9], ['block', 1, 3], ['block', 0.5, 15]].forEach(([t, wear, u]) => {
  const p = at(u, OV);
  const road = mesh(new THREE.PlaneGeometry(5, 9), new THREE.MeshStandardMaterial({ map: asphalt, roughness: 0.95 }));
  road.rotation.x = -Math.PI / 2; road.position.set(p.x, 0.02, p.z); road.castShadow = false; scene.add(road);
  const o = obstacleModel(t); setObstacleWear(o, wear);
  o.position.copy(p); scene.add(o);
  label(u, OV, OBSTACLES[t].name, wear === 1 ? 'hel' : 'halvsliten', 5.4);
});

// rad 3: zombier, tre varianter av varje, går på stället mot basen (-x)
const ZV = 13, zombies = [];
[['walker', -20], ['runner', -5], ['brute', 10]].forEach(([t, u0]) => {
  for (let i = 0; i < 3; i++) {
    const z = zombieModel(t);
    const u = u0 + (i - 1) * (t === 'brute' ? 3.4 : 2.6);
    z.root.position.copy(at(u, ZV + (i % 2) * 0.6));
    z.root.rotation.y = -Math.PI / 2;
    z.phase = Math.random() * 6;
    scene.add(z.root); zombies.push(z);
  }
  label(u0, ZV, ZOMBIES[t].name, 'skala ' + ZOMBIES[t].scale, 2.6);
});

// rad 4: positionsmarkörer
const SV = 24;
[['free', 'ledig', -10], ['locked', 'låst', 0], ['selected', 'vald', 10]].forEach(([s, txt, u]) => {
  const m = slotMarker(s); m.position.copy(at(u, SV)); scene.add(m);
  label(u, SV, 'Position', txt, 3.2);
});

// rad 4, höger: basen där vägen tar slut (modellens +x mot horden, som i spelet)
const BU = 22, BV = 22;
const base = baseModel(); base.position.copy(at(BU, BV)); scene.add(base);
const baseRoad = mesh(new THREE.PlaneGeometry(10, 9), new THREE.MeshStandardMaterial({ map: asphalt, roughness: 0.95 }));
baseRoad.rotation.x = -Math.PI / 2; baseRoad.position.set(base.position.x + 4, 0.02, base.position.z);
baseRoad.castShadow = false; scene.add(baseRoad);
label(BU, BV, 'Basen', 'vägens slut', 7);

// HUD: pilen vid skärmkanten där horden kommer in (samma markup och CSS som i spelet, src/ui/hud.js)
const entry = document.createElement('div');
entry.id = 'entry';
entry.innerHTML = '<div class="chev"><i></i><i></i><i></i></div><div class="txt">Horden kommer</div>';
entry.style.right = 'auto'; entry.style.left = 'calc(100% - 220px)'; entry.style.top = '120px';
entry.querySelector('.chev').style.transform = 'rotate(-2.36rad)';
document.body.appendChild(entry);
const entryLb = document.createElement('div'); entryLb.className = 'lb';
entryLb.innerHTML = 'Pil vid kanten <small>HUD, syns tills första zombien är i bild</small>';
entryLb.style.left = 'calc(100% - 220px)'; entryLb.style.top = '170px';
document.getElementById('labels').appendChild(entryLb);

// dra och zooma
let drag = null;
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; stage.style.cursor = 'grabbing'; });
addEventListener('pointerup', () => { drag = null; stage.style.cursor = ''; });
addEventListener('pointermove', e => {
  if (!drag) return;
  const k = view / innerHeight;
  const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k / Math.sin(Math.atan2(46, Math.hypot(40, 40)));
  target.addScaledVector(R, -dx).addScaledVector(D, -dy);
  drag = { x: e.clientX, y: e.clientY }; applyCamera();
});
stage.addEventListener('wheel', e => { e.preventDefault(); view = Math.min(90, Math.max(12, view * Math.exp(e.deltaY * 0.001))); applyCamera(); }, { passive: false });
const zoomBtn = document.getElementById('zoom');
zoomBtn.onclick = () => {
  const toGame = view !== GAME; view = toGame ? GAME : OVERVIEW;
  if (!toGame) target.set(0, 0, 0);
  zoomBtn.textContent = toGame ? 'Översikt' : 'Spelets avstånd'; applyCamera();
};

// för felsökning i konsolen: lookbook.focus(u, v, view)
window.lookbook = { focus(u, v, w = GAME) { target.copy(at(u, v)); view = w; applyCamera(); } };

const v3 = new THREE.Vector3();
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  for (const z of zombies) {
    z.phase += dt * ZOMBIES[z.type].speed * 2.6 / z.scale;
    zombieWalk(z, z.phase);
  }
  renderer.render(scene, camera);
  for (const l of labels) {
    v3.copy(l.p).project(camera);
    l.el.style.left = ((v3.x + 1) / 2 * innerWidth) + 'px';
    l.el.style.top = ((1 - v3.y) / 2 * innerHeight) + 'px';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body></html>
