<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horde lookbook</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<style>
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lb { position: absolute; transform: translate(-50%, 0); white-space: nowrap; font-size: 12px; letter-spacing: 0.08em;
        padding: 2px 7px; background: var(--plate); border: 1px solid var(--plate-edge); border-radius: 2px; }
  .lb small { color: var(--paper-dim); letter-spacing: 0.04em; }
  #head { position: fixed; top: 14px; left: 14px; padding: 8px 14px 10px; }
  #head .t { font-family: 'Saira Stencil One', sans-serif; font-size: 26px; line-height: 1.1; }
  #head .s { font-size: 12px; color: var(--paper-dim); letter-spacing: 0.06em; margin-top: 2px; }
  #head button { margin-top: 8px; font: 600 12px 'Oswald', sans-serif; letter-spacing: 0.08em; color: var(--paper);
        background: rgba(233,223,201,0.08); border: 1px solid var(--plate-edge); padding: 4px 10px; cursor: pointer; }
  #head button:hover { background: rgba(181,83,42,0.25); }
  #head a.sb { display: inline-block; margin: 8px 0 0 6px; font: 600 12px 'Oswald', sans-serif; letter-spacing: 0.08em; color: var(--paper);
        border: 1px solid var(--plate-edge); padding: 4px 10px; text-decoration: none; }
  #head a.sb:hover { background: rgba(181,83,42,0.25); }
  #stage { cursor: grab; }
</style>
</head><body>
<div id="stage" class="grade"></div>
<div id="labels"></div>
<div id="head" class="plate">
  <div class="t">LOOKBOOK</div>
  <div class="s">Every model under the game light. Drag to pan, wheel to zoom.</div>
  <button id="zoom">Game distance</button>
  <a class="sb" href="soundboard.html">Sound board</a>
</div>
<div id="ver"></div>
<script type="module">
import * as THREE from 'three';
import { VERSION } from './src/version.js';
import { createScene } from './src/render/scene.js';
import { grassTexture } from './src/render/world.js';
import { mesh } from './src/render/kit.js';
import { weaponModel, obstacleModel, setObstacleWear, zombieModel, zombieWalk, zombieAttack, zombieFall, weaponGhost, setGhostTone, baseModel, roadblockModel, grenadeModel } from './src/render/models.js';
import { guardRail, highwayLamp, wreck, semiTruck, bus, boulder, grassTuft, roadSign, farmhouse, barn, shed, hayBale, timberStack, pylon, gantryFrame } from './src/render/e4-kit.js';
import { createFx } from './src/render/fx.js';
import { createHealthRings } from './src/render/rings.js';
import { WEAPONS } from './src/data/weapons.js';
import { OBSTACLES } from './src/data/obstacles.js';
import { ZOMBIES } from './src/data/zombies.js';
import { asphaltTexture } from './src/render/world.js';
import { spruce, pine, birch } from './src/render/gnesta-kit.js';
import { createBatch, frame, seeded, villa, hedge, fence, lamp, mailbox, gardenTree, car, GP, rowHouse, brickWall, plankFence, parkingLot, forskola, forskolaYard } from './src/render/gnesta-kit.js';
import { createFortify } from './src/render/fortify.js';
import { rinkEntranceModel, setBaseDamage } from './src/render/models.js';
import { hvSoldierModel, hvPose, hvRun, hvDown, squadGhost, setSquadGhost, crewCarryModel } from './src/render/models.js';
import { SQUAD } from './src/sim/squad.js';
import { bridge as mbBridge, stairTower, track, platform as mbPlatform, shelter, departureSign, catenaryPortal, meshFence, x60, folketsHus, stationHouse, cafeHarmoni,
  missionHouse, yellowHouse, whiteHouse, chainHouses, hembygdsgard, logFence, kvarnen, apartment, trafficLight, rockCut, roadRail, signMesh, placeIn } from './src/render/molnbo-kit.js';

document.getElementById('ver').textContent = 'v' + VERSION;
const OVERVIEW = 44, GAME = 25;
const map = { camera: { target: [0, 0], view: OVERVIEW } };
const { renderer, scene, camera } = createScene(document.getElementById('stage'), map);

// samma kamera-offset som spelet, men flyttbar och zoombar
const OFFSET = new THREE.Vector3(40, 46, 40);
const target = new THREE.Vector3(0, 0, 0);
let view = OVERVIEW;
function applyCamera() {
  const a = innerWidth / innerHeight, v = a < 1 ? view * 1.5 : view;
  camera.left = -v * a / 2; camera.right = v * a / 2; camera.top = v / 2; camera.bottom = -v / 2;
  camera.position.copy(target).add(OFFSET); camera.lookAt(target);
  camera.updateProjectionMatrix();
}
addEventListener('resize', applyCamera); applyCamera();

// mark
const ground = mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshStandardMaterial({ map: grassTexture(), roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.castShadow = false; scene.add(ground);
const asphalt = asphaltTexture(); asphalt.repeat.set(1, 1);

// rutnät i bildens riktning: u åt höger, v nedåt (isometriskt)
const R = new THREE.Vector3(1, 0, -1).normalize(), D = new THREE.Vector3(1, 0, 1).normalize();
const at = (u, v) => R.clone().multiplyScalar(u).add(D.clone().multiplyScalar(v));
const labels = [];
function label(u, v, text, sub, drop = 0) {
  const el = document.createElement('div'); el.className = 'lb';
  el.innerHTML = text + (sub ? ` <small>${sub}</small>` : '');
  document.getElementById('labels').appendChild(el);
  labels.push({ el, p: at(u, v + drop) });
}

// rad 1: vapen nivå 1 till 3
const WV = -15;
[['m249', -22], ['m2', 3]].forEach(([t, u0]) => {
  for (let lv = 1; lv <= 3; lv++) {
    const w = weaponModel(t, lv);
    w.group.position.copy(at(u0 + (lv - 1) * 8, WV));
    w.pivot.rotation.y = -0.35;                                           // siktar lite mot vägen
    scene.add(w.group);
    label(u0 + (lv - 1) * 8, WV, WEAPONS[t].name, 'level ' + lv, 4.6);
  }
});

// rad 2: hinder på en vägbit, hela och halvslitna
const OV = 1;
[['wire', 1, -21], ['wire', 0.5, -9], ['block', 1, 3], ['block', 0.5, 15]].forEach(([t, wear, u]) => {
  const p = at(u, OV);
  const road = mesh(new THREE.PlaneGeometry(5, 9), new THREE.MeshStandardMaterial({ map: asphalt, roughness: 0.95 }));
  road.rotation.x = -Math.PI / 2; road.position.set(p.x, 0.02, p.z); road.castShadow = false; scene.add(road);
  const o = obstacleModel(t); setObstacleWear(o, wear);
  o.position.copy(p); scene.add(o);
  label(u, OV, OBSTACLES[t].name, wear === 1 ? 'intact' : 'half worn', 5.4);
});

// rad 3: zombier, tre varianter av varje, går på stället mot basen (-x).
// Hälsoringen vid 100, 60 och 20 % (i spelet syns den först när zombien tagit skada).
const ZV = 13, zombies = [];
const rings = createHealthRings(scene, 32), HEALTH = [1, 0.6, 0.2];
[['walker', -20], ['runner', -5], ['brute', 10]].forEach(([t, u0]) => {
  for (let i = 0; i < 3; i++) {
    const z = zombieModel(t);
    const u = u0 + (i - 1) * (t === 'brute' ? 3.4 : 2.6);
    z.root.position.copy(at(u, ZV + (i % 2) * 0.6));
    z.root.rotation.y = -Math.PI / 2;
    z.phase = Math.random() * 6;
    z.hp = HEALTH[i];
    scene.add(z.root); zombies.push(z);
  }
  label(u0, ZV, ZOMBIES[t].name, 'scale ' + ZOMBIES[t].scale + ' · health 100, 60, 20 %', 2.6);
});
// till höger: slår mot ett hinder, och faller (om och om igen)
const poses = [];
[['walker', 'attack', 17.5], ['brute', 'attack', 20.5], ['walker', 'fall', 24]].forEach(([t, act, u]) => {
  const z = zombieModel(t);
  z.root.position.copy(at(u, ZV));
  z.root.rotation.y = -Math.PI / 2;
  z.act = act; z.t = Math.random() * 3; z.hp = act === 'fall' ? 0 : 0.45;
  scene.add(z.root); poses.push(z);
});
label(19, ZV, 'Attacking', 'barrier', 2.6);
label(24, ZV, 'Dying', 'loops', 2.6);

// rad 4: placeringens spöke (grönt där pjäsen får stå, rött där den inte får)
const SV = 24;
[['m249', true, 'valid', -10], ['m249', false, 'invalid', 0], ['m2', true, 'valid', 10]].forEach(([t, ok, txt, u]) => {
  const m = weaponGhost(t); setGhostTone(m, ok); m.position.copy(at(u, SV)); scene.add(m);
  label(u, SV, 'Placing', txt, 3.2);
});

// rad 4, höger: basen där vägen tar slut (modellens +x mot horden, som i spelet)
const BU = 23, BV = 28;
const base = baseModel(); base.position.copy(at(BU, BV)); scene.add(base);
const baseRoad = mesh(new THREE.PlaneGeometry(10, 9), new THREE.MeshStandardMaterial({ map: asphalt, roughness: 0.95 }));
baseRoad.rotation.x = -Math.PI / 2; baseRoad.position.set(base.position.x + 4, 0.02, base.position.z);
baseRoad.castShadow = false; scene.add(baseRoad);
label(BU, BV, 'Base', 'end of the road', 2.5);

// rad 5: granatlådan på en position, en granat, och kast + smäll om och om igen
const GV = 37;
[['m249', 1, -20], ['m2', 2, -10]].forEach(([t, lv, u]) => {
  const w = weaponModel(t, lv, { kit: true });
  w.group.position.copy(at(u, GV)); w.pivot.rotation.y = -0.35; scene.add(w.group);
  label(u, GV, WEAPONS[t].name + ' + grenade kit', 'crate beside the gunner', 4.6);
});
const gr = grenadeModel(); gr.scale.setScalar(4); gr.position.copy(at(-2, GV)).setY(0.6); scene.add(gr);
label(-2, GV, 'Grenade', 'shown 4x', 1.6);
const fx = createFx(scene);
const blastAt = at(12, GV), throwFrom = at(4, GV - 3).setY(1.5);
const blastRoad = mesh(new THREE.PlaneGeometry(12, 9), new THREE.MeshStandardMaterial({ map: asphalt, roughness: 0.95 }));
blastRoad.rotation.x = -Math.PI / 2; blastRoad.position.set(blastAt.x, 0.02, blastAt.z); blastRoad.castShadow = false; scene.add(blastRoad);
label(12, GV, 'Grenade throw and blast', 'arc, fireball, dirt, light, scorch', 4.2);
const THROW_EVERY = 3, FLIGHT = 0.8;
let throwT = THROW_EVERY - 0.5, blastPending = false, frozen = false;
function grenadeLoop(dt) {
  if (frozen) return;
  throwT += dt;
  if (throwT >= THROW_EVERY) { throwT = 0; blastPending = true; fx.grenade(throwFrom, blastAt.clone().setY(0.15), FLIGHT); }
  if (blastPending && throwT >= FLIGHT) { blastPending = false; fx.blast(blastAt.x, blastAt.z, 3.5); }
  fx.update(dt);
}

// HUD: pilen vid skärmkanten där horden kommer in (samma markup och CSS som i spelet, src/ui/hud.js)
const entry = document.createElement('div');
entry.id = 'entry';
entry.innerHTML = '<div class="chev"><i></i><i></i><i></i></div><div class="txt">Horde incoming</div>';
entry.style.right = 'auto'; entry.style.left = 'calc(100% - 220px)'; entry.style.top = '120px';
entry.querySelector('.chev').style.transform = 'rotate(-2.36rad)';
document.body.appendChild(entry);
const entryLb = document.createElement('div'); entryLb.className = 'lb';
entryLb.innerHTML = 'Edge arrow <small>HUD, shown until the first zombie is on screen</small>';
entryLb.style.left = 'calc(100% - 220px)'; entryLb.style.top = '170px';
document.getElementById('labels').appendChild(entryLb);

// rad 5: Gnesta (villor, häck, staket, gatlykta). Byggs i en batch, några anrop för hela raden.
{
  const GV = 48, b = createBatch(), r = seeded(3);
  const yaw = Math.atan2(R.x, R.z);                                        // framsidan mot kameran
  const villas = [
    ['Villa', 'gable, 1 storey', { w: 9.5, d: 7, storeys: 1, roof: 'gable', facade: 'white', roofColor: 'black', chimney: true, seed: 11 }],
    ['Villa', 'hip, garage', { w: 9, d: 7.2, storeys: 1, roof: 'hip', facade: 'brickGrey', roofColor: 'charcoal', garage: 1, seed: 5 }],
    ['Villa', '1.5 storey, balcony', { w: 8.5, d: 8, storeys: 1.5, roof: 'gable', ridge: 'z', balcony: true, facade: 'grey', roofColor: 'black', chimney: true, seed: 7 }],
    ['Villa', 'board, veranda, solar', { w: 9.5, d: 7, storeys: 1, roof: 'gable', facade: 'red', roofColor: 'tile', veranda: true, solar: true, chimney: true, seed: 9 }],
  ];
  villas.forEach(([t, sub, o], i) => {
    const u = -24 + i * 15, p = at(u, GV);
    villa(b, frame(null, p.x, 0, p.z, yaw - Math.PI / 2 + 0.35), o);
    label(u, GV, t, sub, 7.5);
  });
  // häck, vitt spjälstaket, grått spjälstaket och gatlykta
  const q = (u, v) => at(u, v);
  let a = q(-26, GV + 13), c = q(-16, GV + 13); hedge(b, a.x, a.z, c.x, c.z, r, 1.8);
  label(-21, GV + 13, 'Hedge', 'instanced boxes', 2.8);
  a = q(-12, GV + 13); c = q(-2, GV + 13); fence(b, a.x, a.z, c.x, c.z, r, 'picket');
  label(-7, GV + 13, 'Picket fence', '', 2.8);
  a = q(2, GV + 13); c = q(12, GV + 13); fence(b, a.x, a.z, c.x, c.z, r, 'slat');
  label(7, GV + 13, 'Slat fence', '', 2.8);
  const lp = q(18, GV + 13); lamp(b, frame(null, lp.x, 0, lp.z, yaw));
  label(18, GV + 13, 'Street lamp', '', 2.8);
  const mp = q(23, GV + 13); mailbox(b, frame(null, mp.x, 0, mp.z, yaw), 2, r);
  label(23, GV + 13, 'Mailboxes', '', 2.8);
  const gt = q(28, GV + 13); gardenTree(b, frame(null, gt.x, 0, gt.z, 0), 5.5, 2, r);
  label(28, GV + 13, 'Garden tree', '', 2.8);
  b.flush(scene);
}

// rad 6: befäst position (H036). Samma trädgårdshörna två gånger: orörd, och med en Ksp 90
// utställd. Runt pjäsen huggs häcken ner, staketet rivs, trädet fälls, bilen blir ett vrak,
// brevlådan välts och sandsäckar läggs i en bruten vall. Samma kod som i spelet (fortify.js).
{
  const FV = 78;
  [['before', -14], ['after', 10]].forEach(([which, u0]) => {
    const b = createBatch(), r = seeded(21);
    const o = at(u0, FV), ox = o.x, oz = o.z;
    const P = (dx, dz) => [ox + dx, oz + dz];
    const lawn = mesh(new THREE.PlaneGeometry(16, 12), new THREE.MeshStandardMaterial({ color: GP.lawnMown, roughness: 1 }));
    lawn.rotation.x = -Math.PI / 2; lawn.position.set(ox, 0.01, oz); lawn.castShadow = false; scene.add(lawn);
    let [ax, az] = P(-6, 3), [cx, cz] = P(6, 3);
    b.tag = { kind: 'hedge' }; hedge(b, ax, az, cx, cz, r, 1.8);
    [ax, az] = P(-6, -3); [cx, cz] = P(2, -3);
    b.tag = { kind: 'fence', ax, az, dx: 1, dz: 0 }; fence(b, ax, az, cx, cz, r, 'picket');
    const [tx, tz] = P(3.2, -1.5); b.tag = { kind: 'tree', x: tx, z: tz }; gardenTree(b, frame(null, tx, 0, tz, 0), 5.5, 2, r);
    const [kx, kz] = P(-3.5, 0.2); b.tag = { kind: 'car', x: kx, z: kz, ry: 0.2 }; car(b, frame(null, kx, 0, kz, 0.2), GP.car[6]);
    const [mx, mz] = P(-1, -2.2); b.tag = { kind: 'junk', what: 'mailbox', x: mx, z: mz }; mailbox(b, frame(null, mx, 0, mz, 0), 2, r);
    b.tag = null;
    const sub = new THREE.Group(); scene.add(sub);
    b.flush(sub);
    if (which === 'after') {
      const f = createFortify(sub, { tagged: b.tagged });
      const [gx, gz] = P(0, 0.4);
      const w = weaponModel('m249', 1); w.group.position.set(gx, 0, gz); w.pivot.rotation.y = -0.35; scene.add(w.group);
      f.setPositions([{ x: gx, z: gz, key: 1234 }]);
    }
    label(u0, FV, 'Gun position', which === 'before' ? 'before' : 'after: hedge cut, fence down, tree felled, car wrecked', 7);
  });
}

// rad 7: Gnestas bas, ishallens entré, hel och på väg att falla (skadan i fem steg)
{
  const EV = 96;
  const doors = [-9.7, -0.8, 0.8, 9.7];
  [[0, -22, 'intact'], [0.45, -6, 'half'], [0.8, 10, 'nearly fallen'], [1, 26, 'fallen']].forEach(([dmg, u, txt]) => {
    const p = at(u, EV);
    const wall = mesh(new THREE.BoxGeometry(2, 3.6, 12), new THREE.MeshStandardMaterial({ color: GP.rinkRed, roughness: 0.9 }));
    wall.position.set(p.x - 1, 1.8, p.z); wall.rotation.y = -Math.PI / 4; scene.add(wall);
    const e = rinkEntranceModel({ doors: doors.filter(z => Math.abs(z) < 3), main: 0 });
    e.position.set(p.x, 0, p.z); e.rotation.y = wall.rotation.y;
    // väggens framsida: modellens +x
    const n = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), wall.rotation.y);
    wall.position.set(p.x - n.x, 1.8, p.z - n.z);
    setBaseDamage(e, dmg); scene.add(e);
    label(u, EV, 'Ice rink entrance', txt, 3);
  });
}

// rad 8: arsenalen (0.8.0). Ksp 58, Ak 5 med granattillsats och Psg 90 i nivå 1 till 3, Psg 90
// liggande på ett villatak (som i spelet: ingen säckring, på takets höjd) och dess spöke på taket.
{
  const AV = 114;
  [['ksp58', -26], ['ak5', -2], ['psg90', 22]].forEach(([t, u0]) => {
    for (let lv = 1; lv <= 3; lv++) {
      const w = weaponModel(t, lv);
      w.group.position.copy(at(u0 + (lv - 1) * 8, AV));
      w.pivot.rotation.y = -0.35;
      scene.add(w.group);
      label(u0 + (lv - 1) * 8, AV, WEAPONS[t].name, 'level ' + lv, 4.6);
    }
  });
  const RV = AV + 16;
  const ak = weaponModel('ak5', 2, { kit: true }); ak.group.position.copy(at(-26, RV)); ak.pivot.rotation.y = -0.35; scene.add(ak.group);
  label(-26, RV, WEAPONS.ak5.name + ' + grenade kit', '40 mm tube under the barrel', 4.6);
  // Villan: gaveltak, nocken längs x, takhöjd 0,32 + 2,75 + 3,5 * tan(0,47) = 4,85 m (som data/gnesta.js räknar).
  const b = createBatch();
  [[-6, 'Psg 90 on a roof', 'prone, ghillie, sees over houses'], [14, 'Placing on a roof', 'ghost on the roof top']].forEach(([u, t, sub], i) => {
    const p = at(u, RV), yaw = Math.atan2(R.x, R.z) - Math.PI / 2 + 0.35;
    villa(b, frame(null, p.x, 0, p.z, yaw), { w: 9.5, d: 7, storeys: 1, roof: 'gable', facade: i ? 'grey' : 'red', roofColor: 'black', seed: 31 + i });
    const ridge = 0.32 + 2.75 + 3.5 * Math.tan(0.47);
    if (!i) {
      const w = weaponModel('psg90', 2, { roof: true }); w.group.position.set(p.x, ridge, p.z); w.pivot.rotation.y = -0.35; scene.add(w.group);
    } else {
      const g = weaponGhost('psg90', { roof: true }); setGhostTone(g, true); g.position.set(p.x, ridge, p.z); scene.add(g);
    }
    label(u, RV, t, sub, 7.5);
  });
  b.flush(scene);
}

// rad 9: Hemvärnet (0.9.0). Soldaten i m/90 med Ak 4 i alla ställningar: på huk vid en husknut
// (lutar sig ut åt båda håll), på knä bakom häck, på magen i diket, springer ut, stupad.
// Sedan samma husknut två gånger: markeringen i handen (före) och gruppen i skydd (efter).
const hvMen = [];
{
  const HV = 150;
  const yaw = Math.atan2(R.x, R.z) + Math.PI / 2 - 0.5;      // tittar ner mot vänster i bild, som mot gatan
  [['crouch', -24, 'Crouching at a corner', 'leans out left', -1], ['crouch', -14, 'Crouching at a car', 'leans out right', 1],
   ['kneel', -4, 'Kneeling', 'behind hedge or fence', 0], ['prone', 6, 'Prone', 'in a ditch or open grass', 0],
   ['run', 16, 'Running', 'out to his spot', 0], ['down', 26, 'Down', 'zombies reached him', 0]].forEach(([st, u, t, sub, lean], i) => {
    const m = hvSoldierModel(40 + i);
    const p = at(u, HV);
    m.root.position.set(p.x, 0, p.z); m.root.rotation.y = yaw;
    if (st === 'run') hvRun(m, 0.9); else if (st === 'down') hvDown(m, 1); else hvPose(m, st, { lean });
    scene.add(m.root);
    hvMen.push({ m, st, lean, t: i });
    label(u, HV, t, sub, 3.2);
  });
  // en grupp i skydd vid en husknut: före (markeringen i handen) och efter (de har tagit skydd)
  const BV = HV + 18;
  [['before', -12], ['after', 14]].forEach(([which, u0]) => {
    const b = createBatch(), r = seeded(77);
    const o = at(u0, BV), ox = o.x, oz = o.z;
    const lawn = mesh(new THREE.PlaneGeometry(22, 18), new THREE.MeshStandardMaterial({ color: GP.lawnMown, roughness: 1 }));
    lawn.rotation.x = -Math.PI / 2; lawn.position.set(ox, 0.01, oz); lawn.castShadow = false; scene.add(lawn);
    const road = mesh(new THREE.PlaneGeometry(22, 6), new THREE.MeshStandardMaterial({ map: asphalt, roughness: 1 }));
    road.rotation.x = -Math.PI / 2; road.position.set(ox, 0.02, oz + 12); road.castShadow = false; scene.add(road);
    villa(b, frame(null, ox - 4, 0, oz - 3, 0), { w: 9, d: 7, storeys: 1, roof: 'gable', facade: 'grey', roofColor: 'black', seed: 5 });
    car(b, frame(null, ox + 6, 0, oz + 3.5, 0.15), GP.car[2]);
    hedge(b, ox - 9, oz + 7.5, ox + 1, oz + 7.5, r, 1.4);
    b.flush(scene);
    const spots = [
      { x: ox + 1.8, z: oz + 1.6, st: 'crouch', lean: 1 },     // husknuten
      { x: ox + 4.4, z: oz + 5.6, st: 'crouch', lean: -1 },    // bilen
      { x: ox - 4, z: oz + 6.2, st: 'kneel' },                 // häcken
      { x: ox + 9.5, z: oz + 7.6, st: 'prone' },               // diket vid gatan
    ];
    if (which === 'before') {

// dra och zooma
let drag = null;
const stage = document.getElementById('stage');
stage.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; stage.style.cursor = 'grabbing'; });
addEventListener('pointerup', () => { drag = null; stage.style.cursor = ''; });
addEventListener('pointermove', e => {
  if (!drag) return;
  const k = view / innerHeight;
  const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k / Math.sin(Math.atan2(46, Math.hypot(40, 40)));
  target.addScaledVector(R, -dx).addScaledVector(D, -dy);
  drag = { x: e.clientX, y: e.clientY }; applyCamera();
});
stage.addEventListener('wheel', e => { e.preventDefault(); view = Math.min(90, Math.max(12, view * Math.exp(e.deltaY * 0.001))); applyCamera(); }, { passive: false });
const zoomBtn = document.getElementById('zoom');
zoomBtn.onclick = () => {
  const toGame = view !== GAME; view = toGame ? GAME : OVERVIEW;
  if (!toGame) target.set(0, 0, 0);
  zoomBtn.textContent = toGame ? 'Overview' : 'Game distance'; applyCamera();
};

// för felsökning i konsolen: lookbook.focus(u, v, view)
// lookbook.blastAt(s): stoppar kastslingan och visar smällen s sekunder efter nedslaget (null = slinga igen).
window.lookbook = {
  focus(u, v, w = GAME) { target.copy(at(u, v)); view = w; applyCamera(); },
  blastAt(sec) {
    fx.clear();
    if (sec == null) { frozen = false; throwT = THROW_EVERY - 0.5; return; }
    frozen = true; blastPending = false;
    fx.blast(blastAt.x, blastAt.z, 3.5);
    for (let t = 0; t < sec; t += 1 / 60) fx.update(1 / 60);
  },
};

const v3 = new THREE.Vector3();
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  rings.begin();
  for (const z of zombies) {
    z.phase += dt * ZOMBIES[z.type].speed * 2.6 / z.scale;
    zombieWalk(z, z.phase, now / 1000);
    rings.add(z.root.position.x, z.root.position.z, z.hp, Math.min(1.35, z.scale));
  }
  for (const z of poses) {
    z.t += dt;
    if (z.act === 'attack') { zombieAttack(z, z.t * 11, now / 1000); rings.add(z.root.position.x, z.root.position.z, z.hp, Math.min(1.35, z.scale)); }
    else {
      const f = Math.min(1, (z.t % 2.4) / 0.3);
      if (f < 0.05) zombieWalk(z, 0, now / 1000);
      zombieFall(z, f * f);
    }
  }
  rings.end();
  grenadeLoop(dt);
  for (const h of hvMen) if (h.st === 'run') hvRun(h.m, now / 1000 * 9);
  for (const h of campMen) if (h.st === 'run') hvRun(h.m, now / 1000 * 9);
  renderer.render(scene, camera);
  for (const l of labels) {
    v3.copy(l.p).project(camera);
    l.el.style.left = ((v3.x + 1) / 2 * innerWidth) + 'px';
    l.el.style.top = ((1 - v3.y) / 2 * innerHeight) + 'px';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
